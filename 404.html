<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found">
    <title>404 — Page Not Found</title>

    <!-- favicon -->
    <link rel="icon" href="/myWorkout-project-2/assets/images/favicon.png">

    <!-- css -->
    <link rel="stylesheet" href="/myWorkout-project-2/assets/css/style.css">

    <!-- bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- custom scripts -->
    <script src="assets/scripts/404.js" defer></script>

</head>

<body class="error-body">
    <main class="error">
        <div class="code" aria-hidden="true">404</div>

        <h1 id="404-header">Page not found</h1>

        <p>
            Sorry, we couldn't find the page you're looking for.
            It may have been moved, deleted, or the URL may be incorrect.
        </p>

        <div class="actions">
            <button class="secondary error-button" type="button" id="back-button">
                Go back
            </button>
            <a class="btn btn-primary error-a" href="/myWorkout-project-2/">Go Home</a>
        </div>
    </main>

</body>

</html>
