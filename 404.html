<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>

  <!-- favicon from freepik on flaticon-->
  <link rel="icon" href="assets/images/favicon.png">

  <!-- bootstrap css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- custom css -->
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- custom scripts -->
  <script src="assets/scripts/myworkouts.js" defer></script>
</head>

<body>
  <main class="error" role="main">
    <div class="code" aria-hidden="true">404</div>

    <h1>Page not found</h1>

    <p>
      Sorry, we couldn't find the page you're looking for.
      It may have been moved, deleted, or the URL may be incorrect.
    </p>

    <div class="actions">
      <a class="primary" href="/">Go home</a>

      <button class="secondary" type="button" onclick="history.back()">
        Go back
      </button>
    </div>
  </main>
</body>
</html>
