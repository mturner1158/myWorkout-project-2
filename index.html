<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MyWorkout allows you to track your workouts and how you are progressing">
  <title>MyWorkout | Dashboard</title>

  <!-- favicon from freepik on flaticon-->
  <link rel="icon" href="assets/images/favicon.png">

  <!-- bootstrap css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- custom css -->
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- custom scripts -->
  <script src="assets/scripts/script.js" defer></script>
</head>

<!-- classes on body set to work with mt-auto on footer to ensure it always tays at the bottom of the page - taken from boardwalk-games code -->

<body class="d-flex flex-column min-vh-100">
  <!-- Navbar begins with bootstrap and modified to suit site -->
  <nav id="navbar" class="navbar navbar-expand-lg fixed-top navbar-dark">
    <div class="container">
      <a id="logo" class="navbar-brand" href="index.html">MyWorkout</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item nav-btn">
            <a class="nav-link active" aria-current="page" href="index.html">Dashboard</a>
          </li>
          <li class="nav-item nav-btn">
            <a class="nav-link" href="myworkouts.html">My workouts</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- main section -->
  <main class="flex-grow-1">
    <section id="workouts" class="container">
      <div class="row g-2">
        <div class="col-12 count-section">
          <div class="history mb-4">
            <h1 class="h3">Workout history</h1>
            <p>A record of all your logged sessions</p>
            <div class="row g-2">
              <div class="col-3">
                <div class="history-card">
                  <!-- weekly counts -->
                  <p class="workout-count"> <span id="weekly-count">0</span> </p>
                  <p class="workout-count-text">This week</p>
                </div>
              </div>
              <div class="col-3">
                <div class="history-card">
                  <!-- montly count -->
                  <p class="workout-count"> <span id="monthly-count">4</span> </p>
                  <p class="workout-count-text">This month</p>
                </div>
              </div>
              <div class="col-3">
                <div class="history-card">
                  <!-- yearly count -->
                  <p class="workout-count"> <span id="yearly-count">24</span> </p>
                  <p class="workout-count-text">This year</p>
                </div>
              </div>
              <div class="col-3">
                <div class="history-card">
                  <!-- total count -->
                  <p class="workout-count"> <span id="total-count">35</span> </p>
                  <p class="workout-count-text">All time</p>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12">
          <div class="submission-section">
            <div class="workout-tile">
              <h1 class="h4">Log a workout</h1>
              <p>Fill in an exercise and hit + to add it to your session</p>
              <form method="POST" id="new-workout-form" class="w-100">
                <div class="row g-2">
                  <div class="col-4">
                    <label for="exercise" class="form-label"><i class="fa-solid fa-dumbbell"></i> Exercise</label>
                    <input type="text" class="form-control" name="exercise" id="exercise" placeholder="e.g. bench press">
                  </div>
                  <div class="col-3">
                    <label for="weight" class="form-label"><i class="fa-solid fa-weight-hanging"></i> Weight (kg)</label>
                    <input type="number" class="form-control" name="weight" id="weight" placeholder="0">
                  </div>
                  <div class="col-3">
                    <label for="reps" class="form-label"><i class="fa-solid fa-clipboard"></i> Reps</label>
                    <input type="number" class="form-control" name="reps" id="reps" placeholder="0">
                  </div>
                  <div class="col-2 d-flex align-items-end pb-1">
                    <button type="submit" class="btn add-exercise-btn" aria-label="add-exercise-button">
                      <i class="fa-solid fa-plus" id="submit-exercise"></i>
                    </button>
                  </div>
                </div>
                <!-- remove link for form submission -->
              </form>
              <div id="submission-display">
                <table id="workout-table" class="mt-3 invisible">
                  <colgroup>
                    <col>
                    <col>
                    <col>
                    <col>
                  </colgroup>
                  <thead>
                    <tr>
                      <th><i class="fa-solid fa-dumbbell"></i> Exercise</th>
                      <th><i class="fa-solid fa-weight-hanging"></i> Weight (kg)</th>
                      <th><i class="fa-solid fa-clipboard"></i>Reps</th>
                      <th>Remove</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
              <div id="overall-buttons">
                <button id="overall-submit-button" class="final-btn">Submit your workout</button>
                <button id="overall-reset-button" class="final-btn">Reset</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- footer -->
  <footer id="footer" class="mt-auto">
    <div class="container">
      <div class="row">
        <!-- link to social media sites -->
        <div id="socials" class="col text-end">
          <p>
            <a href="https://facebook.com" target="_blank" aria-label="facebook"><i class="fa-brands fa-square-facebook"></i></a>
            <a href="https://instagram.com" target="_blank" aria-label="instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://twitter.com" target="_blank" aria-label="twitter"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://www.tiktok.com" target="_blank" aria-label="tiktok"><i class="fa-brands fa-tiktok"></i></a>
          </p>
        </div>
      </div>
    </div>
  </footer>

  <!-- Font awesome -->
  <script src="https://kit.fontawesome.com/3312e5dbfd.js" crossorigin="anonymous"></script>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
