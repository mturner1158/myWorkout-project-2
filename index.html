<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="MyWorkout allows you to track your workouts and how you are progressing" />
  <title>MyWorkout | Dashboard</title>

  <!-- favicon from freepik on flaticon-->
  <link rel="icon" href="assets/images/favicon.png" />

  <!-- bootstrap css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

  <!-- custom css -->
  <link rel="stylesheet" href="assets/css/style.css" />

  <!-- custom scripts -->
  <script src="script.js" defer></script>
</head>

<!-- classes on body set to work with mt-auto on footer to ensure it always tays at the bottom of the page - taken from boardwalk-games code -->

<body class="d-flex flex-column min-vh-100">
  <!-- Navbar begins with bootstrap and modified to suit site -->
  <nav id="navbar" class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
      <a id="logo" class="navbar-brand" href="index.html">MyWorkout</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item nav-btn">
            <a class="nav-link active" aria-current="page" href="#">Dashboard</a>
          </li>
          <li class="nav-item nav-btn">
            <a class="nav-link" href="#">My workouts</a>
          </li>
          <li class="nav-item nav-btn">
            <a class="nav-link" href="#">Progress</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- main section -->
  <main>
    <section id="workouts" class="container">

      <div class="row justify-content-end">
        <div class="col-12 col-lg-6">
          <div class="row">
            <div class="history mb-4">
              <h1>History</h1>
              <p>Below are a record of all your logged workouts</p>
<div class="row">
                <div class="col-3">
                  <!-- weekly counts -->
                  <p class="workout-count"> <span id="weekly-count">0</span> </p>
                  <p class="workout-count-text"> workouts this week</p>
                </div>
                <div class="col-3">
                  <!-- montly count -->
                  <p class="workout-count"> <span id="monthly-count">4</span> </p>
                  <p class="workout-count-text"> workouts this month</p>
                </div>
                <div class="col-3">
                  <!-- yearly count -->
                  <p class="workout-count"> <span id="yearly-count">24</span> </p>
                  <p class="workout-count-text"> workouts this year</p>
                </div>
                <div class="col-3">
                  <!-- total count -->
                  <p class="workout-count"> <span id="total-count">35</span> </p>
                  <p class="workout-count-text"> workouts in total</p>
                </div>
              </div>


            </div>
          </div>
          <div class="row workout-tile">
              <div>
                <div>
                  <h1>Log a Workout!</h1>
                  <p>Use the form below to submit your latest workout</p>
                  <form action="https://formdump.codeinstitute.net" method="POST" id="new-workout-form" class="w-100">
                  <div class="row">
                    <div class="col-5">
                      <label for="exercise" class="form-label">Exercise</label>
                      <input type="text" class="form-control" name="exercise" />
                    </div>
                    <div class="col-3">
                      <label for="Weight" class="form-label">Weight</label>
                      <input type="number" class="form-control" name="weight" />
                    </div>
                    <div class="col-3">
                      <label for="reps" class="form-label">Reps</label>
                      <input type="number" class="form-control" name="reps" />
                    </div>
                    <div class="col-1 d-flex align-items-end pb-1">
                      <button type="submit" class="btn"><i class="fa-solid fa-plus" id="submit-exercise"></i></button>
                    </div>
                  </div>
                  <!-- remove link for form submission -->
                </form>
                </div>
              </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- footer -->
  <footer id="footer" class="mt-auto">
    <div class="container">
      <div class="row">
        <!-- link to social media sites -->
        <div id="socials" class="col text-end">
          <p>
            <a href="https://facebook.com" target="_blank"><i class="fa-brands fa-square-facebook"></i></a>
            <a href="https://instagram.com" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://twitter.com" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://www.tiktok.com" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
          </p>
        </div>
      </div>
    </div>
  </footer>

  <!-- Font awesome -->
  <script src="https://kit.fontawesome.com/3312e5dbfd.js" crossorigin="anonymous"></script>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
